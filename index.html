<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#007AFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OmniSell" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>OmniSell</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top-nav">
    <div class="top-nav-inner">
      <div class="brand">
        <div class="brand-icon">OS</div>
        <div>
          <div class="brand-title">OmniSell</div>
          <div class="brand-sub">Global Stores & Orders</div>
        </div>
      </div>

      <div class="top-controls">
        <div class="segmented" id="timeframeSegmented">
          <button data-tf="today" class="active">Today</button>
          <button data-tf="7d">7 Days</button>
          <button data-tf="30d">30 Days</button>
        </div>

        <select id="currencySelect" class="select-pill" aria-label="Display Currency">
          <option value="INR">INR (₹)</option>
          <option value="USD">USD ($)</option>
          <option value="CAD">CAD (C$)</option>
          <option value="GBP">GBP (£)</option>
          <option value="EUR">EUR (€)</option>
        </select>
      </div>
    </div>
  </header>

  <nav class="desktop-tabs" id="desktopTabs" aria-label="Main Navigation">
    <button class="desktop-tab-btn active" data-tab="dashboard">My Stores</button>
    <button class="desktop-tab-btn" data-tab="store">Order Summary</button>
    <button class="desktop-tab-btn" data-tab="directory">All Marketplaces</button>
    <button class="desktop-tab-btn" data-tab="sync">Settings & Sync</button>
  </nav>

  <main id="appMain" class="app-main"></main>

  <nav class="bottom-tab-bar" id="mobileTabs" aria-label="Mobile Navigation">
    <button class="tab-item active" data-tab="dashboard">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg>
      <span>Stores</span>
    </button>
    <button class="tab-item" data-tab="store">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Orders</span>
    </button>
    <button class="tab-item" data-tab="directory">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>Explore</span>
    </button>
    <button class="tab-item" data-tab="sync">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="sheetBackdrop" class="sheet-backdrop hidden" role="dialog" aria-modal="true">
    <div class="sheet-panel" id="sheetPanel"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
